<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a2422">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kalima</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --bg-deep:#071e1c;
    --bg-mid:#0e3634;
    --glass: rgba(255,255,255,0.07);
    --glass-strong: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.16);
    --gold:#c9a23c;
    --gold-bright:#e8c778;
    --ink:#eef5f2;
    --ink-dim:#a9c7c0;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(232,199,120,0.10), transparent 55%),
      radial-gradient(ellipse 700px 600px at 100% 15%, rgba(30,120,110,0.28), transparent 50%),
      radial-gradient(ellipse 800px 700px at 0% 100%, rgba(201,162,60,0.08), transparent 55%),
      linear-gradient(160deg, var(--bg-deep), var(--bg-mid) 60%, #0a2e2b 100%);
    background-attachment:fixed;
    font-family:'Manrope', sans-serif;
    color: var(--ink);
    padding: max(20px, env(safe-area-inset-top)) 0 max(90px, env(safe-area-inset-bottom));
    overflow-x:hidden;
  }

  .wrap{ width:100%; max-width:520px; margin:0 auto; padding:0 16px; }

  .header{ display:flex; flex-direction:column; align-items:center; margin-bottom:18px; }
  .logo-mark{
    width:56px; height:56px; border-radius:16px; margin-bottom:10px;
    background: linear-gradient(145deg, rgba(255,255,255,0.14), rgba(255,255,255,0.03));
    border:1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    position:relative; overflow:hidden;
  }
  .logo-mark svg{ width:30px; height:30px; }
  .brand{ font-family:'Amiri', serif; font-size:26px; letter-spacing:1.5px; font-weight:700; color:var(--ink); }
  .tagline{ font-size:12px; color:var(--ink-dim); letter-spacing:2px; text-transform:uppercase; margin-top:2px; }

  .perm-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: var(--glass); border:1px solid var(--glass-border); backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px); border-radius:16px; padding:12px 14px; margin-bottom:16px;
    font-size:12.5px; color:var(--ink-dim);
  }
  .perm-banner button{
    flex-shrink:0; border:none; border-radius:10px; padding:8px 14px; font-size:12.5px; font-weight:700;
    background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color:#1a1a12; cursor:pointer;
  }
  .perm-banner.hidden{ display:none; }

  .tabs{
    position:relative; display:flex; background: var(--glass); border:1px solid var(--glass-border);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius:18px; padding:5px; margin-bottom:20px;
  }
  .tab-indicator{
    position:absolute; top:5px; left:5px; height:calc(100% - 10px); width:calc(50% - 5px);
    background: linear-gradient(135deg, rgba(232,199,120,0.9), rgba(201,162,60,0.9));
    border-radius:13px; transition: transform 0.38s cubic-bezier(.2,.9,.25,1);
    box-shadow: 0 6px 16px rgba(201,162,60,0.35);
  }
  .tab-indicator.right{ transform: translateX(100%); }
  .tab{
    position:relative; z-index:1; flex:1; text-align:center; padding:11px 0; font-size:13.5px;
    font-weight:800; letter-spacing:0.5px; color: var(--ink-dim); cursor:pointer; transition: color .3s;
    user-select:none;
  }
  .tab.active{ color:#1a1a12; }

  .panel{ display:none; animation: fadeSlide .38s cubic-bezier(.2,.9,.25,1); }
  .panel.active{ display:block; }
  @keyframes fadeSlide{ from{ opacity:0; transform: translateY(10px);} to{ opacity:1; transform:translateY(0);} }

  .list{ display:flex; flex-direction:column; gap:14px; }

  .card{
    background: var(--glass); border:1px solid var(--glass-border);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius:20px; padding:18px 18px 16px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.10);
    position:relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:-40%; left:-20%; width:70%; height:70%;
    background: radial-gradient(circle, rgba(255,255,255,0.10), transparent 70%);
    pointer-events:none;
  }
  .occasion{
    display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
    color:#1a1a12; background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    padding:4px 10px; border-radius:8px; margin-bottom:12px;
  }
  .arabic{
    direction: rtl; text-align:right; font-family:'Amiri', serif; font-size:22px; line-height:2;
    color:#fff; margin-bottom:10px;
  }
  .meaning{ font-size:13.5px; line-height:1.6; color: var(--ink-dim); margin-bottom:14px; }

  .alarm-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; flex:1; }
  .chip{
    display:flex; align-items:center; gap:6px; background: rgba(232,199,120,0.14);
    border:1px solid rgba(232,199,120,0.35); color: var(--gold-bright); font-size:12.5px; font-weight:700;
    padding:5px 10px; border-radius:20px;
  }
  .chip .x{ cursor:pointer; opacity:0.7; font-size:13px; line-height:1; }
  .chip .x:active{ opacity:1; }

  .add-alarm-btn{
    flex-shrink:0; width:34px; height:34px; border-radius:11px; border:1px solid var(--glass-border);
    background: rgba(255,255,255,0.06); color: var(--gold-bright); font-size:18px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .add-alarm-btn:active{ transform:scale(0.92); }

  .time-picker-row{
    display:none; align-items:center; gap:8px; margin-top:12px; padding-top:12px;
    border-top:1px solid var(--glass-border);
  }
  .time-picker-row.open{ display:flex; }
  .time-picker-row input[type=time]{
    flex:1; background: rgba(0,0,0,0.2); border:1px solid var(--glass-border); border-radius:10px;
    padding:8px 10px; color: var(--ink); font-size:14px; color-scheme: dark;
  }
  .time-picker-row button{
    border:none; border-radius:10px; padding:9px 14px; font-size:13px; font-weight:800;
    background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color:#1a1a12; cursor:pointer;
  }

  .toast{
    position:fixed; left:50%; bottom:max(20px, env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(30px) scale(0.96);
    width: calc(100% - 32px); max-width:460px;
    background: rgba(20,45,42,0.55); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border:1px solid rgba(255,255,255,0.22); border-radius:18px; padding:14px 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.18);
    opacity:0; transition: all .45s cubic-bezier(.2,.9,.25,1); pointer-events:none; z-index:50;
    display:flex; gap:12px; align-items:flex-start;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  .toast .bell{
    width:34px; height:34px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--gold), var(--gold-bright)); font-size:16px;
  }
  .toast .txt b{ font-family:'Amiri', serif; font-size:16px; display:block; color:#fff; margin-bottom:2px; }
  .toast .txt span{ font-size:12.5px; color: var(--ink-dim); line-height:1.4; }

  .install-banner{
    display:none; background: var(--glass); border:1px solid var(--glass-border); backdrop-filter: blur(18px);
    border-radius:16px; padding:14px 16px; margin-bottom:16px; font-size:13px; text-align:center; color:var(--ink-dim);
  }
  .install-banner button{
    margin-top:10px; padding:9px 16px; border-radius:10px; border:none;
    background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color:#1a1a12; font-weight:800; font-size:13px; cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo-mark">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e8c778"/>
            <stop offset="100%" stop-color="#c9a23c"/>
          </linearGradient>
        </defs>
        <path d="M62 20 C78 24 88 40 84 56 C81 68 71 76 60 78 C68 68 71 55 66 44 C71 42 76 36 73 28 C71 23 66 20 62 20 Z" fill="url(#g1)"/>
        <path d="M28 18 H38 V46 L60 18 H74 L48 50 L76 82 H62 L40 54 V82 H28 Z" fill="url(#g1)"/>
      </svg>
    </div>
    <div class="brand">KALIMA</div>
    <div class="tagline">Zikr &middot; Salovat &middot; Duo</div>
  </div>

  <div class="install-banner" id="installBanner">
    Kalima'ni ekraningizga ilova sifatida o'rnating.
    <div><button id="installBtn">Ekranga o'rnatish</button></div>
  </div>

  <div class="perm-banner" id="permBanner">
    <span>Budilniklar ishlashi uchun bildirishnomaga ruxsat bering</span>
    <button id="permBtn">Ruxsat berish</button>
  </div>

  <div class="tabs">
    <div class="tab-indicator" id="tabIndicator"></div>
    <div class="tab active" data-panel="salovatlar">SALOVATLAR</div>
    <div class="tab" data-panel="duolar">DUOLAR</div>
  </div>

  <div class="panel active" id="panel-salovatlar">
    <div class="list" id="list-salovatlar"></div>
  </div>

  <div class="panel" id="panel-duolar">
    <div class="list" id="list-duolar"></div>
  </div>

</div>

<div class="toast" id="toast">
  <div class="bell">🔔</div>
  <div class="txt">
    <b id="toastTitle"></b>
    <span id="toastBody"></span>
  </div>
</div>

<script>
const SALOVATLAR = [
  { id:"s1", occasion:"Namozda (tashahhud)",
    ar:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ",
    uz:"Ey Alloh, Muhammad va uning oilasiga rahmat yubor, xuddi Ibrohim va uning oilasiga rahmat yuborganingdek. Albatta, Sen maqtovga sazovor va ulug'sansan." },
  { id:"s2", occasion:"Kunlik qisqa zikr",
    ar:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَسَلِّمْ",
    uz:"Ey Alloh, Muhammadga rahmat va salomatlik ber." },
  { id:"s3", occasion:"Ismi eshitilganda",
    ar:"صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ",
    uz:"Allohning rahmati va saloti unga (Muhammadga) bo'lsin." },
  { id:"s4", occasion:"Juma kuni",
    ar:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ النَّبِيِّ الْأُمِّيِّ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ",
    uz:"Ey Alloh, ummiy Payg'ambar Muhammadga, uning oilasi va sahobalariga rahmat va salomatlik ber." },
  { id:"s5", occasion:"Tunda o'qiladigan",
    ar:"اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِينَ",
    uz:"Ey Alloh, sarvarimiz Muhammadga, uning oilasi va barcha sahobalariga rahmat, salomatlik va barakot ber." },
  { id:"s6", occasion:"Duodan oldin",
    ar:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ وَعَلَى الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ",
    uz:"Ey Alloh, bandang va rasuling Muhammadga, mo'min erkak va ayollarga rahmat yubor." },
  { id:"s7", occasion:"Safarga chiqishda",
    ar:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ كُلَّمَا ذَكَرَهُ الذَّاكِرُونَ",
    uz:"Ey Alloh, Muhammadga har safar zikr qiluvchilar uni yodga olganda rahmat yubor." },
  { id:"s8", occasion:"Tahajjud vaqtida",
    ar:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ عَدَدَ مَا فِي عِلْمِ اللَّهِ صَلَاةً دَائِمَةً بِدَوَامِ مُلْكِ اللَّهِ",
    uz:"Ey Alloh, Muhammadga Alloh ilmidagi sanoq bo'yicha, Alloh mulki abadiy bo'lgani kabi doimiy rahmat yubor." }
];

const DUOLAR = [
  { id:"d1", occasion:"Uyg'onganda",
    ar:"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ",
    uz:"Bizni uxlatgach qayta uyg'otgan Allohga hamd bo'lsin, qaytish faqat Ungadir." },
  { id:"d2", occasion:"Uxlashga yotganda",
    ar:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا",
    uz:"Ey Alloh, Sening isming bilan uxlayman va uyg'onaman." },
  { id:"d3", occasion:"Ovqatlanishdan oldin",
    ar:"بِسْمِ اللَّهِ",
    uz:"Alloh nomi bilan boshlayman." },
  { id:"d4", occasion:"Ovqatlanishdan keyin",
    ar:"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ",
    uz:"Bizni ovqatlantirgan, sug'organ va musulmon qilgan Allohga hamd bo'lsin." },
  { id:"d5", occasion:"Uydan chiqishda",
    ar:"بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",
    uz:"Alloh nomi bilan, Allohga tavakkal qildim, kuch-quvvat faqat Alloh birlandir." },
  { id:"d6", occasion:"Uyga kirishda",
    ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ الْمَوْلِجِ وَخَيْرَ الْمَخْرَجِ",
    uz:"Ey Alloh, Sendan kirishning va chiqishning yaxshiligini so'rayman." },
  { id:"d7", occasion:"Qiyinchilik va tashvishda",
    ar:"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",
    uz:"Alloh bizga yetarli, U qanday ajoyib vakildir." },
  { id:"d8", occasion:"Ilm o'rganishda",
    ar:"رَبِّ زِدْنِي عِلْمًا",
    uz:"Rabbim, ilmimni ziyoda qilgin." },
  { id:"d9", occasion:"Kasallikda shifo so'rab",
    ar:"اللَّهُمَّ رَبَّ النَّاسِ أَذْهِبِ الْبَأْسَ اشْفِ أَنْتَ الشَّافِي",
    uz:"Ey Alloh, odamlarning Robbisi, kasallikni ketkaz, shifo ber, chunki shifo beruvchi faqat Sensan." },
  { id:"d10", occasion:"Yangi kiyim kiyganda",
    ar:"الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا",
    uz:"Meni shu bilan kiyintirgan Allohga hamd bo'lsin." },
  { id:"d11", occasion:"Tashvish va qarzdorlikda",
    ar:"اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ",
    uz:"Ey Alloh, halolingni harom o'rniga yetarli qil va fazlingdan boshqalarga muhtoj qilmagin." }
];

let alarms = {};
let firedThisMinute = {};

function renderList(items, containerId){
  const container = document.getElementById(containerId);
  container.innerHTML = items.map(item => `
    <div class="card" data-id="${item.id}">
      <div class="occasion">${item.occasion}</div>
      <div class="arabic">${item.ar}</div>
      <div class="meaning">${item.uz}</div>
      <div class="alarm-row">
        <div class="chips" id="chips-${item.id}"></div>
        <div class="add-alarm-btn" data-add="${item.id}">+</div>
      </div>
      <div class="time-picker-row" id="picker-${item.id}">
        <input type="time" id="time-${item.id}" value="07:00">
        <button data-confirm="${item.id}">Qo'shish</button>
      </div>
    </div>
  `).join('');
}

renderList(SALOVATLAR, "list-salovatlar");
renderList(DUOLAR, "list-duolar");

function renderChips(id){
  const wrap = document.getElementById(`chips-${id}`);
  const times = alarms[id] || [];
  wrap.innerHTML = times.map(t => `
    <div class="chip">⏰ ${t}<span class="x" data-remove="${id}|${t}">✕</span></div>
  `).join('');
}

document.body.addEventListener('click', (e) => {
  const addId = e.target.closest('[data-add]')?.dataset.add;
  if (addId){
    const row = document.getElementById(`picker-${addId}`);
    row.classList.toggle('open');
    return;
  }
  const confirmId = e.target.closest('[data-confirm]')?.dataset.confirm;
  if (confirmId){
    const val = document.getElementById(`time-${confirmId}`).value;
    if (val){
      alarms[confirmId] = alarms[confirmId] || [];
      if (!alarms[confirmId].includes(val)) alarms[confirmId].push(val);
      alarms[confirmId].sort();
      renderChips(confirmId);
      document.getElementById(`picker-${confirmId}`).classList.remove('open');
    }
    return;
  }
  const removeData = e.target.closest('[data-remove]')?.dataset.remove;
  if (removeData){
    const [id, t] = removeData.split('|');
    alarms[id] = (alarms[id] || []).filter(x => x !== t);
    renderChips(id);
    return;
  }
});

[...SALOVATLAR, ...DUOLAR].forEach(item => renderChips(item.id));

const tabs = document.querySelectorAll('.tab');
const indicator = document.getElementById('tabIndicator');
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`panel-${tab.dataset.panel}`).classList.add('active');
    indicator.classList.toggle('right', tab.dataset.panel === 'duolar');
  });
});

const permBanner = document.getElementById('permBanner');
const permBtn = document.getElementById('permBtn');
function updatePermBanner(){
  if (!window.Notification || Notification.permission === 'granted'){
    permBanner.classList.add('hidden');
  } else {
    permBanner.classList.remove('hidden');
  }
}
updatePermBanner();
permBtn.addEventListener('click', async () => {
  if (window.Notification){
    try { await Notification.requestPermission(); } catch(e){}
  }
  updatePermBanner();
});

let swRegistration = null;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(reg => swRegistration = reg).catch(()=>{});
}
let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById("installBanner").style.display = "block";
});
document.getElementById("installBtn").addEventListener("click", async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById("installBanner").style.display = "none";
});

const ALL_ITEMS = {};
[...SALOVATLAR, ...DUOLAR].forEach(i => ALL_ITEMS[i.id] = i);

function pad(n){ return n < 10 ? '0'+n : ''+n; }

function checkAlarms(){
  const now = new Date();
  const hhmm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const minuteKey = `${now.getFullYear()}${now.getMonth()}${now.getDate()}${hhmm}`;

  Object.keys(alarms).forEach(id => {
    (alarms[id] || []).forEach(t => {
      if (t === hhmm){
        const fireKey = `${id}-${minuteKey}`;
        if (!firedThisMinute[fireKey]){
          firedThisMinute[fireKey] = true;
          fireNotification(ALL_ITEMS[id]);
        }
      }
    });
  });
}

function fireNotification(item){
  if (!item) return;

  const toast = document.getElementById('toast');
  document.getElementById('toastTitle').textContent = item.occasion;
  document.getElementById('toastBody').textContent = item.uz;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 5000);

  if (window.Notification && Notification.permission === 'granted'){
    if (swRegistration && swRegistration.active){
      swRegistration.active.postMessage({
        type: "SHOW_NOTIFICATION", title: item.occasion, body: item.uz
      });
    } else {
      try { new Notification(item.occasion, { body: item.uz }); } catch(e){}
    }
  }
}

setInterval(checkAlarms, 15000);
</script>
